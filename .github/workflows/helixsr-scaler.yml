# HelixSR Scaler: builds the DLL on every push and pull request, packs the Windows zip and the Linux / Steam Deck
# tar.gz (same DLL, run through Proton; tested under Wine here), and attaches both to a draft release when a v* tag
# is pushed (git tag v1.0.0 && git push origin v1.0.0), or when the workflow is started by hand with "release" ticked
# (Actions > HelixSR Scaler > Run workflow): the draft gets the tag v<HELIXSR_SCALER_VERSION> on the commit it built.
# Publish the draft on GitHub when it's tested.

name: HelixSR Scaler

on:
  push:
    branches: [ "helixsr" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "helixsr" ]
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish release v<version> (the version in OptiScaler/resource.h), for the HelixSR release to copy'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      name: ${{ steps.version.outputs.name }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'

    - name: Version
      id: version
      shell: pwsh
      run: |
        $h = Get-Content OptiScaler\resource.h
        $v = (('MAJOR', 'MINOR', 'PATCH') | ForEach-Object {
          ($h | Select-String "#define HELIXSR_SCALER_VERSION_$_\s+(\d+)").Matches[0].Groups[1].Value
        }) -join '.'
        $name = "HelixSR-Scaler-$v"
        if (-not $env:GITHUB_REF.StartsWith('refs/tags/') -and "${{ inputs.release }}" -ne "true") { $name += '-' + $env:GITHUB_SHA.Substring(0, 7) }
        "version=$v" >> $env:GITHUB_OUTPUT
        "name=$name" >> $env:GITHUB_OUTPUT
        Write-Output "HelixSR Scaler $v ($name)"

    - name: Tag matches the version
      if: startsWith(github.ref, 'refs/tags/')
      shell: pwsh
      run: |
        if ("${{ github.ref_name }}" -ne "v${{ steps.version.outputs.version }}") {
          Write-Error "Tag ${{ github.ref_name }} doesn't match HELIXSR_SCALER_VERSION in resource.h (${{ steps.version.outputs.version }})"
          exit 1
        }

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build
      run: msbuild /m /p:Configuration=Release . /verbosity:minimal "/flp:errorsonly;logfile=build-errors.log"

    # Compiler errors as annotations, readable on the run's summary page and through the API
    - name: Show build errors
      if: failure()
      shell: pwsh
      run: |
        if (Test-Path build-errors.log) {
          Get-Content build-errors.log | Select-Object -Unique -First 40 | ForEach-Object {
            $line = $_ -replace '\s*\[[^\]]*\.vcxproj\]\s*$', ''
            $line = $line -replace '^.*?\\OptiScaler\\OptiScaler\\', ''
            Write-Output ("::error::" + $line)
          }
        }

    - name: Package
      shell: pwsh
      run: |
        $out = "${{ github.workspace }}\package\${{ steps.version.outputs.name }}"
        New-Item -ItemType Directory -Force $out | Out-Null
        Copy-Item -Recurse "${{ github.workspace }}\x64\Release\a\*" $out
        Remove-Item -Force "$out\!! EXTRACT ALL FILES TO GAME FOLDER !!" -ErrorAction SilentlyContinue
        Copy-Item LICENSE "$out\Licenses\OptiScaler_LICENSE.txt"
        Copy-Item helixsr\README.txt "$out\README.txt"
        # NVIDIA Streamline 2.8.0 (the release HelixSR's frame generation is made from) in OptiScaler\streamline: a game
        # with an older Streamline then runs DLSS Frame Generation with these (OptiScaler swaps in only newer ones)
        $sl = "$env:RUNNER_TEMP\streamline"
        Invoke-WebRequest https://github.com/NVIDIA-RTX/Streamline/releases/download/v2.8.0/streamline-sdk-v2.8.0.zip -OutFile "$sl.zip"
        if ((Get-FileHash "$sl.zip").Hash -ne '313669F8CF886F823EA0518A50712EFA5E2E8623689ED2A6BD0D9353E475BC47') { throw 'Streamline 2.8.0 download changed' }
        Expand-Archive "$sl.zip" $sl
        New-Item -ItemType Directory -Force "$out\OptiScaler\streamline" | Out-Null
        Copy-Item "$sl\bin\x64\sl.*.dll", "$sl\bin\x64\NvLowLatencyVk.dll" "$out\OptiScaler\streamline"
        Copy-Item "$sl\license.txt" "$out\Licenses\Streamline_LICENSE.txt"
        if ((Get-ChildItem "$out\OptiScaler\streamline" -Filter sl.dlss_g.dll).Count -ne 1) { throw 'no sl.dlss_g.dll' }
        # HelixSR Scaler's Linux setup in place of OptiScaler's, and the list of the download's files it uses
        Copy-Item -Force helixsr\setup_linux.sh "$out\setup_linux.sh"
        Push-Location $out
        Get-ChildItem -Recurse -File | ForEach-Object { (Resolve-Path -Relative $_.FullName).Substring(2).Replace('\', '/') } |
          Sort-Object | Set-Content -Encoding ascii HelixSR-Scaler-package.txt
        Pop-Location

    - name: Test setup_windows.bat's HelixSR step
      shell: pwsh
      run: helixsr\tests\test_setup_windows.ps1

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.version.outputs.name }}
        path: ${{ github.workspace }}\package
        if-no-files-found: error

  linux:
    needs: build
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        name: ${{ needs.build.outputs.name }}
        path: win

    - name: Package
      run: |
        name="${{ needs.build.outputs.name }}-linux"
        out="linux/$name"
        mkdir -p linux
        cp -r "win/${{ needs.build.outputs.name }}" "$out"
        rm -f "$out/setup_windows.bat" "$out/HelixSR-Scaler-package.txt"
        cp helixsr/setup_linux.sh "$out/setup_linux.sh"
        chmod +x "$out/setup_linux.sh"
        cp helixsr/README-Linux.txt "$out/README.txt"
        (cd "$out" && find . -type f | sed 's|^\./||' | LC_ALL=C sort >HelixSR-Scaler-package.txt)
        tar -C linux -czf "$name.tar.gz" "$name"
        echo "name=$name" >>"$GITHUB_ENV"
        ls -la "$out"

    - name: Install test tools
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends shellcheck wine wine64 mingw-w64 >/dev/null

    - name: Check scripts
      run: shellcheck -S warning helixsr/setup_linux.sh helixsr/tests/*.sh

    - name: Test setup_linux.sh
      run: helixsr/tests/test_setup_linux.sh "linux/$name"

    - name: Test under Wine
      run: helixsr/tests/test_wine.sh "linux/$name"

    - name: Test HelixSR resource states without a GPU
      run: bash helixsr/tests/test_resource_states.sh

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ env.name }}
        path: ${{ env.name }}.tar.gz
        if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/') || inputs.release
    needs: [build, linux]
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Files
      run: |
        name="${{ needs.build.outputs.name }}"
        (cd "artifacts/$name" && zip -qr "$GITHUB_WORKSPACE/$name.zip" "$name")
        cp "artifacts/$name-linux/$name-linux.tar.gz" .
        ls -la *.zip *.tar.gz

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        draft: false
        make_latest: true
        tag_name: v${{ needs.build.outputs.version }}
        target_commitish: ${{ github.sha }}
        name: HelixSR Scaler ${{ needs.build.outputs.version }}
        files: |
          ${{ needs.build.outputs.name }}.zip
          ${{ needs.build.outputs.name }}-linux.tar.gz
        body: |
          HelixSR Scaler ${{ needs.build.outputs.version }}, based on OptiScaler. Source code: this repository (GPL-3.0).

          - Windows: ${{ needs.build.outputs.name }}.zip
          - Linux and Steam Deck: ${{ needs.build.outputs.name }}-linux.tar.gz (run ./setup_linux.sh)
